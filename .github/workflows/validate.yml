name: Validate

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  CHANGELOG_FILE: CHANGELOG.md

jobs:
  lint:
    name: Lint
    if: fromJSON('[]')[0] != null
    uses: k-3679/reusable-workflows/.github/workflows/lint.yml@main
    with:
      linters: '[]'
      # Adjust these if your language sources don't live at the repo root.
      php-path: "."
      python-path: "."
      eslint-config: ".eslintrc.json"
      eslint-glob: "**/*.js"
      go-path: "."
      rust-path: "."
      c-path: "."

  security:
    name: Security scan
    uses: k-3679/reusable-workflows/.github/workflows/security-scan.yml@main
    with:
      scan-ref: "."
      fail-threshold-percent: 0

  changelog:
    name: Validate changelog
    runs-on: ubuntu-latest
    continue-on-error: true 
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Checks the changelog was genuinely updated by whatever triggered this workflow.
      - uses: k-3679/reusable-workflows/.github/actions/validate-changelog@main
        with:
          changelog-file: ${{ env.CHANGELOG_FILE }}
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          default-branch: main

      # Blocks merging into main while [Unreleased] still has pending entries.
      - name: Check unreleased changes on main
        if: github.event_name == 'pull_request'
        uses: k-3679/reusable-workflows/.github/actions/check-unreleased-changelog@main
        with:
          changelog-file: ${{ env.CHANGELOG_FILE }}
          ref: ${{ github.event.pull_request.base.sha }}

  summary:
    name: Validation summary
    if: always()
    needs: [lint, security, changelog]
    runs-on: ubuntu-latest
    steps:
      - name: Report job results
        env:
          # Code scanning alerts are branch-scoped; link straight to the ref that was scanned.
          SCAN_LINK: ${{ github.event_name == 'pull_request' && github.event.pull_request.html_url || format('https://github.com/{0}/security/code-scanning?query=ref:{1}', github.repository, github.ref) }}
        run: |
          {
            echo "### 📝 Validation summary"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Lint | ${{ needs.lint.result }} |"
            echo "| Security scan | ${{ needs.security.result }} |"
            echo "| Validate changelog | ${{ needs.changelog.result }} |"
            echo
            echo "Trivy findings: **${{ needs.security.outputs.total }}**"
            echo "[View scan results]($SCAN_LINK)"
          } >> "$GITHUB_STEP_SUMMARY"
