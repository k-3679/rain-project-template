name: Validate Changes

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

# Cancels stale runs so only the latest commit needs to run and pass the required PR checks to merge.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true


env:
  CHANGELOG_FILE: CHANGELOG.md

jobs:
  check-init:
    name: Check repo is initialized
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        env:
          IS_TEMPLATE: ${{ github.event.repository.is_template }}
        run: |
          set -euo pipefail
          if [ "$IS_TEMPLATE" = "true" ] || [ ! -f .github/workflows/initialize-repo.yml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Repo initialization has not finished, skipping validation."
          fi

  lint:
    name: Lint
    needs: check-init
    if: needs.check-init.outputs.ready == 'true' && fromJSON('[]')[0] != null
    permissions:
      contents: read
    uses: k-3679/reusable-workflows/.github/workflows/lint.yml@main
    with:
      linters: '[]'
      php-path: "."
      python-path: "."
      eslint-config: ".eslintrc.json"
      eslint-glob: "**/*.js"
      go-path: "."
      rust-path: "."
      c-path: "."

  trivy:
    name: Trivy scan
    needs: check-init
    if: needs.check-init.outputs.ready == 'true'
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: k-3679/reusable-workflows/.github/workflows/trivy.yml@main
    with:
      scan-ref: "."
      fail-threshold-percent: 0

  codeql:
    name: CodeQL scan
    needs: check-init
    if: needs.check-init.outputs.ready == 'true'
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    uses: k-3679/reusable-workflows/.github/workflows/codeql.yml@main
    with:
      languages: '[{"language":"actions","build-mode":"none"}]'

  changelog:
    name: Validate changelog
    needs: check-init
    if: needs.check-init.outputs.ready == 'true' && github.actor != 'dependabot[bot]' && github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: k-3679/reusable-workflows/.github/actions/validate-changelog@main
        with:
          changelog-file: ${{ env.CHANGELOG_FILE }}
          base-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          default-branch: main

      - name: Check unreleased changes on main
        if: github.event_name == 'pull_request'
        uses: k-3679/reusable-workflows/.github/actions/check-unreleased-changelog@main
        with:
          changelog-file: ${{ env.CHANGELOG_FILE }}
          ref: ${{ github.event.pull_request.base.sha }}

  summary:
    name: Validation summary
    if: always()
    needs: [check-init, lint, trivy, codeql, changelog]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report job results
        env:
          READY: ${{ needs.check-init.outputs.ready }}
          LINT: ${{ needs.lint.result }}
          TRIVY: ${{ needs.trivy.result }}
          CODEQL: ${{ needs.codeql.result }}
          CHANGELOG: ${{ needs.changelog.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCAN_URL: ${{ github.event_name == 'pull_request' && format('{0}/{1}/security/code-scanning?query=pr:{2}', github.server_url, github.repository, github.event.pull_request.number) || format('{0}/{1}/security/code-scanning?query=ref:{2}', github.server_url, github.repository, github.ref) }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name || 'N/A' }}
          REF_NAME: ${{ github.ref_name || 'N/A' }}
          ACTOR: ${{ github.actor || 'N/A' }}
          PR_NUMBER: ${{ github.event.pull_request.number || 'N/A' }}
          PR_URL: ${{ github.event.pull_request.html_url || 'N/A' }}
          PR_BASE: ${{ github.event.pull_request.base.ref || 'N/A' }}
        run: |
          set -euo pipefail

          if [ "$READY" != "true" ]; then
            verdict="⏭️ **Skipped.** Repo initialization has not finished, see the setup checklist issue."
          elif printf '%s\n' "$LINT" "$TRIVY" "$CODEQL" "$CHANGELOG" \
            | grep -qE '^(failure|cancelled)$'; then
            verdict="❌ **Validation failed.** Open the failing job below for the details."
          else
            verdict="✅ **Validation passed.**"
          fi

          case "$EVENT" in
            pull_request) trigger="**pull request** [#${PR_NUMBER}](${PR_URL}) into \`${PR_BASE}\`" ;;
            push)         trigger="**push** to \`${REF_NAME}\`" ;;
            schedule)     trigger="**weekly scheduled scan** of \`${REF_NAME}\`" ;;
            *)            trigger="**${EVENT}** on \`${REF_NAME}\`" ;;
          esac

          {
            echo "### 📝 Validation summary"
            echo ""
            echo "$verdict"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Lint | $LINT |"
            echo "| Trivy scan | $TRIVY |"
            echo "| CodeQL scan | $CODEQL |"
            echo "| Validate changelog | $CHANGELOG |"
            echo ""
            echo "---"
            echo ""
            echo "⚡ Triggered from $trigger, at \`${HEAD_SHA:0:7}\`, by @${ACTOR}."
            echo ""
            echo "🛡️ **Check scan results:** [scan results]($SCAN_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::One or more validation jobs failed, see the summary table."
          exit 1
