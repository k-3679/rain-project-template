name: Bootstrap repo settings

# Run this once after creating a repo from this template. Safe to re-run any timee, every step
# is an upsert against the files in .github/repo-rules/. See that folder's README
# for what each file does and what this workflow can't do for you.

on:
  workflow_dispatch: {}

jobs:
  bootstrap:
    name: Apply repo-rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Repo settings (merge strategy, auto-delete branches, wiki/projects)
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          jq 'del(.immutable_releases)' .github/repo-rules/repo-settings.json \
            | gh api --method PATCH "repos/${{ github.repository }}" --input -

      - name: Release immutability
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ "$(jq -r '.immutable_releases // false' .github/repo-rules/repo-settings.json)" = "true" ]; then
            gh api --method PUT "repos/${{ github.repository }}/immutable-releases"
          else
            gh api --method DELETE "repos/${{ github.repository }}/immutable-releases"
          fi

      - name: Actions permissions (allow-listed actions, read-only default token)
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          jq '{enabled: .permissions.enabled, allowed_actions: .permissions.allowed_actions}' \
            .github/repo-rules/actions-permissions.json \
            | gh api --method PUT "repos/${{ github.repository }}/actions/permissions" --input -

          jq '.selected_actions' .github/repo-rules/actions-permissions.json \
            | gh api --method PUT "repos/${{ github.repository }}/actions/permissions/selected-actions" --input -

          jq '{default_workflow_permissions, can_approve_pull_request_reviews}' \
            .github/repo-rules/actions-permissions.json \
            | gh api --method PUT "repos/${{ github.repository }}/actions/permissions/workflow" --input -

      - name: Rulesets (branch protection for main, tag protection for v*)
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail

          apply_ruleset () {
            local file="$1"
            local name
            name=$(jq -r '.name' "$file")

            local existing_id
            existing_id=$(gh api "repos/${{ github.repository }}/rulesets?includes_parents=false" \
              --jq ".[] | select(.name == \"$name\") | .id" || true)

            if [ -n "$existing_id" ]; then
              echo "Updating existing ruleset '$name' (id: $existing_id)"
              gh api --method PUT "repos/${{ github.repository }}/rulesets/$existing_id" --input "$file"
            else
              echo "Creating ruleset '$name'"
              gh api --method POST "repos/${{ github.repository }}/rulesets" --input "$file"
            fi
          }

          apply_ruleset .github/repo-rules/branch-ruleset.main.json
          apply_ruleset .github/repo-rules/tag-ruleset.releases.json

      - name: Summary
        run: |
          {
            echo "### ⚡Bootstrap complete"
            echo ""
            echo "Applied automatically:"
            echo "- Repo settings (merge strategy, auto-delete branches, projects)"
            echo "- Release immutability"
            echo "- Actions permissions (allow-listed to GitHub-owned + verified + \`k-3679/*\`)"
            echo "- Branch ruleset on \`main\`"
            echo "- Tag ruleset on \`v*\`"
            echo ""
            echo "Still manual (see \`.github/repo-rules/README.md\`):"
            echo "- GitHub Advanced Security / private code scanning, if this repo is private"
            echo "- Repository visibility"
            echo "- Limiting how many branches/tags can be updated in a single push (still a Preview setting, no stable API)"
            echo "- Any org-level policy, if this repo ever moves into an org"
          } >> "$GITHUB_STEP_SUMMARY"
