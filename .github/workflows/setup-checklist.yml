name: Setup checklist

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  checklist:
    name: Open setup checklist
    runs-on: ubuntu-latest
    steps:
      - name: Abort runs on the template repo
        if: ${{ github.event.repository.is_template }}
        run: |
          echo "::error::This runs on repos created FROM rain-project-template, not on the template itself. Create a repo from the template and run it there."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Open the setup issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          url=$(gh issue create \
            --title "📝 Repo setup checklist" \
            --body-file .github/SETUP.md | tail -n1)
          echo "issue-url=$url" >> "$GITHUB_OUTPUT"
          echo "Opened $url"

      - name: Remove the setup files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/setup-checklist.yml .github/SETUP.md
          git commit -m "chore: remove setup checklist scaffolding"
          git push

      - name: Summary
        if: success() && steps.issue.outputs.issue-url != ''
        env:
          ISSUE_URL: ${{ steps.issue.outputs.issue-url }}
        run: |
          {
            echo "### ✅ Setup checklist created"
            echo ""
            echo "Open the [**📝 Repo setup checklist**]($ISSUE_URL) issue and work through it."
            echo "This workflow and \`.github/SETUP.md\` have removed themselves."
          } >> "$GITHUB_STEP_SUMMARY"

