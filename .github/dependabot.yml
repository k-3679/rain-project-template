version: 2
updates:
  # Keep GitHub Actions pinned versions (actions/checkout@v4, etc.) current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

